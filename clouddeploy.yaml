apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: marketing-depa-ia
description: API + Celery worker + video_render worker + Go publisher
serialPipeline:
  stages:
    - targetId: staging
      profiles: ["staging"]
    - targetId: prod
      profiles: ["prod"]
      strategy:
        standard:
          # Verifica que el release quedó sano antes de marcar el rollout como exitoso.
          verify: false

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging
description: Clúster de staging (GKE)
gke:
  # Reemplazar PROJECT_ID / REGION / CLUSTER por los reales antes de aplicar:
  #   gcloud deploy apply --file=clouddeploy.yaml --region=REGION --project=PROJECT_ID
  cluster: projects/PROJECT_ID/locations/REGION/clusters/marketing-staging

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
description: Clúster de producción (GKE)
# Promoción manual: producción publica en cuentas sociales reales, no se autopromueve.
requireApproval: true
gke:
  cluster: projects/PROJECT_ID/locations/REGION/clusters/marketing-prod
