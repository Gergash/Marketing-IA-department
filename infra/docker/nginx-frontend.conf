server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas del dashboard → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el shell de la SPA; sí assets con hash
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
