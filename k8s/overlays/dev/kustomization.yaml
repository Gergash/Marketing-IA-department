apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Solo en dev el Secret va versionado (con placeholders). En staging/prod los
  # secretos se inyectan por Secret Manager / External Secrets, nunca desde el repo.
  - secret.dev.yaml

patches:
  - target: { kind: ConfigMap, name: marketing-config }
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: dev
      - op: add
        path: /data/SHOTSTACK_ENV
        value: stage
  - target: { kind: Deployment, name: api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
