apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target: { kind: ConfigMap, name: marketing-config }
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: prod
      # Key de producción de Shotstack: sin watermark y factura real.
      - op: add
        path: /data/SHOTSTACK_ENV
        value: v1
      - op: add
        path: /data/PROMETHEUS_ENABLED
        value: "true"
  - target: { kind: Deployment, name: api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: worker }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  # video-worker queda en 1 réplica a propósito: cada render de Shotstack cuesta
  # dinero real y paralelizar no acelera un render individual.
